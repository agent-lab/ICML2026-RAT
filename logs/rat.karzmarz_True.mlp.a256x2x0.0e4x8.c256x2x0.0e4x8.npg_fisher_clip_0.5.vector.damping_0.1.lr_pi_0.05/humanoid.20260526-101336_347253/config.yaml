algo_config:
  adv_type: gae
  cg_damping: 0.1
  clamp_ratio: true
  ent_coef: 0.0
  grad: npg
  is_karzmarz: true
  lr_pi: 0.05
  lr_v: 0.001
  max_grad_norm: 0.5
  max_ratio: 10.0
  min_ratio: 0.1
  norm_obj: adv
  optimizer: sgd
  pi_epochs: 4
  pi_minibatches: 8
  post_grad: fisher_clip
  sigma_type: vector
  use_kl_adaptive_lr: true
  v_epochs: 4
  v_minibatches: 8
  with_popart: true
env_config:
  env_name: humanoid
  norm_ret: false
  nsteps: 256
  num_envs: 32
  timesteps_per_proc: 10000000
log_config:
  log_interval: 10
  n_eval_trials: 20
nets_config:
  a_dropout: 0.0
  a_hidden_size: 256
  a_num_layers: 2
  c_dropout: 0.0
  c_hidden_size: 256
  c_num_layers: 2
  norm_obs: true
  type: mlp
